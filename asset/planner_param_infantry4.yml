%YAML:1.0
---
# 步兵4规划器参数

planner:
  latency: 15                    # Average total latency from PC to yaw action complete (in ms) # 15 
  single_shoot_latency: 115       # (in ms), shoot latency of single shoot # 105
  continue_shoot_latency: 10     # (in ms), shoot frequency of continuous shoot
  pitch_comp: 0.0               # Pitch compensation # 0.015
  yaw_comp: 0.0                  # Yaw compensation
  disable_vehicle_center_shoot_mode: true
  consider_air_resistence: false