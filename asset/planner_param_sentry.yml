%YAML:1.0
---
# 步兵4规划器参数

planner:
  latency: 10                    # Average total latency from PC to yaw action complete (in ms) # 10 
  single_shoot_latency: 140       # (in ms), shoot latency of single shoot # 137
  continue_shoot_latency: 45     # (in ms), shoot frequency of continuous shoot
  pitch_comp: -0.01               # Pitch compensation
  yaw_comp: -0.02                  # Yaw compensation
  disable_vehicle_center_shoot_mode: true