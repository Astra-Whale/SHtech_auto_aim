%YAML:1.0
---
# 步兵4规划器参数

planner:
  latency: 35                    # Average total latency from PC to yaw action complete (in ms) # 35 
  single_shoot_latency: 135       # (in ms), shoot latency of single shoot # 150
  continue_shoot_latency: 45     # (in ms), shoot frequency of continuous shoot
  same_trace_threshold: 0.003   # (in rad), trajectory tracking consistency threshold
  pitch_comp: 0.025               # Pitch compensation
  yaw_comp: 0                  # Yaw compensation
  disable_vehicle_center_shoot_mode: true
  consider_air_resistence: false