#Armor Pos
enemy=RED  #RED

#Log
log_folder=log/

#Sensor
source=0#test.avi # hiki camera or video file path
port=/dev/ttyAIM # None(use MockDriver for testing) or port path like /dev/ttyACM0
imu=UART # Enter UART or BMI,(only UART supported now)
flip=0 # 1 to flip input image
latency=100 # Average total latency from PC to yaw action complete (in ms)
shoot_latency=25 # (in ms), shoot frequency of continous shoot

#Detect
model=asset/250526.onnx

#Predict
camera_para=asset/cam_param_inf3.yml
pitch_comp=-0.051
yaw_comp=0
disable_vehicle_center_shoot_mode=true

#Display
timed_serial_debug=false
timed_serial_filelog=false
timed_serial_show=false

sensor_debug=false
sensor_filelog=false
sensor_show=false

detect_debug=false
detect_filelog=false
detect_show=false

predic_debug=false
predic_filelog=false
predic_show=false

foxglove_server_debug=false
foxglove_server_filelog=false
foxglove_server_show=false

predic_plot=false

detect_adjust=false
predic_adjust=false